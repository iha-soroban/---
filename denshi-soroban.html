<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子そろばん</title>
<style>
  :root{ --bar-ink:#eceade; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.55), rgba(0,0,0,0) 55%),
      radial-gradient(140% 110% at 50% 100%, rgba(120,100,70,.18), rgba(0,0,0,0) 60%),
      #e7e2d5;
    touch-action:manipulation;
  }

  /* ── toolbar ─────────────────────────────── */
  #bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:8px 14px; background:linear-gradient(#232428,#141518);
    color:var(--bar-ink); box-shadow:0 2px 8px rgba(0,0,0,.35); z-index:5;
  }
  #bar .brand{ font-weight:700; letter-spacing:.14em; font-size:14px; color:#f4f1e6; }
  .grp{ display:flex; align-items:center; gap:8px; font-size:12px; color:#b9b5a8; }
  select{
    font:inherit; font-size:13px; color:#f2efe6; background:#2a2b30;
    border:1px solid #43454c; border-radius:7px; padding:5px 8px; outline:none;
  }
  select:focus{ border-color:#8a8c96; }
  button{
    font:inherit; font-size:13px; cursor:pointer; border:1px solid #43454c;
    color:#f2efe6; background:#2a2b30; border-radius:8px; padding:6px 12px;
    transition:background .15s, transform .05s;
  }
  button:hover{ background:#383a41; }
  button:active{ transform:translateY(1px); }
  button.metal{
    background:linear-gradient(#fdfdfb,#c9c8c1); color:#2c2b28; border-color:#8f8e88;
    text-shadow:0 1px 0 rgba(255,255,255,.7); font-weight:700;
  }
  button.metal:hover{ background:linear-gradient(#ffffff,#d8d7d0); }
  /* ── stage: SVGが枠内に収まるまま全体をスケール ── */
  #stage{ flex:1; min-height:0; padding:10px 14px; }
  #board{ width:100%; height:100%; display:block; }
  #dotLayer{ pointer-events:none; }
  .hit{ fill:transparent; cursor:pointer; pointer-events:all; }
  .hit:hover{ fill:rgba(90,70,30,.06); }
  .beadG{ cursor:pointer; transition:transform .13s ease; }
  .beadG:hover{ filter:brightness(1.07); }
  .beadUse{ filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }

  footer{ padding:6px 12px 10px; text-align:center; font-size:11px; color:#87816f; letter-spacing:.03em; }
  footer b{ color:#5c5748; font-weight:600; }

  @media (prefers-reduced-motion: reduce){ .beadG{ transition:none; } }
  @media (max-width:760px){ #bar{ gap:8px; padding:6px 8px; } }
</style>
</head>
<body>

<header id="bar">
  <div class="brand">電子そろばん</div>
  <div class="grp">桁数
    <select id="rodsSel" aria-label="桁数">
      <option>5</option><option selected>13</option>
      <option>17</option><option>23</option>
    </select>
  </div>
  <div class="grp">定位点
    <button id="clrDots">すべて消す</button>
  </div>
  <button id="resetBtn" class="metal" title="すべての珠をはじきの位置に戻します">ご破算</button>
  <button id="sndBtn" title="効果音のオン/オフ" aria-pressed="true">🔊</button>
</header>

<main id="stage">
  <svg id="board" preserveAspectRatio="xMidYMid meet" aria-label="そろばん"></svg>
</main>

<footer>
  <b>操作</b>:珠を<b>直接タップ</b>で移動(五玉はタップで切替) ｜
  <b>定位点</b>:3桁ごとの決まった位置に黒の点 ｜
  <b>梁をクリック</b> → クリックした桁に<b>そのまま赤</b>が付き、緑は3桁下・青は3桁上に並びます(初期は赤が中央/23桁は右から3桁目基準) ｜
  <b>ご破算</b>:全珠リセット ｜ 🔊で効果音のオン/オフ
</footer>

<script>
'use strict';
const board=document.getElementById('board');

/* ── 寸法(SVGユーザー単位・珠の高さ=100) ──
   地珠の上下に動きの余裕(40+37)を持たせ、珠が確実に見えて動くようにする */
const CELL=172.16, PADX=48, PADY=48;
const HEAVEN=175, BEAMH=30, ZONE=480;            // 天域1.75珠 / 梁0.3珠 / 地域4.8珠
const BEADW=140, BEADH=100;
const INNERH=HEAVEN+BEAMH+ZONE;                  // 685
const BOARDH=INNERH+2*PADY;                      // 769
const beamTop=PADY+HEAVEN, beamBot=beamTop+BEAMH;

let rods=13;
let digits=new Array(rods).fill(0);              // 右端が一の位
let dots=new Map(); // 位(右端=0)→色。applyPreset が標準配置を設定

let soundOn=true, AC=null;
function actx(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
// 短い「チッ」音:発振器+ピッチ低下
function tick(f0,f1,dur,vol,delay=0){
  const c=actx(); if(!c) return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
// 珠が当たる「パチッ」:短いノイズをバンドパスで
function snap(fc,vol,delay=0){
  const c=actx(); if(!c) return;
  const t=c.currentTime+delay, len=Math.max(1,Math.floor(c.sampleRate*.035));
  const buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
  for(let k=0;k<len;k++) ch[k]=(Math.random()*2-1)*Math.pow(1-k/len,2);
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fc; bp.Q.value=1.1;
  const g=c.createGain(); g.gain.value=vol;
  src.connect(bp).connect(g).connect(c.destination); src.start(t);
}
// どの珠も同じ明るい「パチッ」。木の珠らしく毎回少しだけ高さを揺らす
function pachi(vol=1,delay=0){
  snap(2900+Math.random()*500, .45*vol, delay);
  tick(1750+Math.random()*350, 1350, .03, .09*vol, delay);
}
const snd={
  up:  ()=>pachi(),
  down:()=>pachi(.9),
  five:()=>pachi(1.05)
};

/* ── 参考写真どおりの黄色ビュートン珠(横長二重円錐) ── */
const DEFS=`<defs>
  <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3a3b3f"/><stop offset=".25" stop-color="#1c1d20"/>
    <stop offset=".65" stop-color="#0a0b0c"/><stop offset="1" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f0e5"/><stop offset="1" stop-color="#e2ddcb"/>
  </linearGradient>
  <linearGradient id="shUp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.30)"/>
  </linearGradient>
  <linearGradient id="shDn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="rgba(0,0,0,.34)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
  </linearGradient>
  <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#fbfbf8"/><stop offset="1" stop-color="#e4e4dc"/>
  </linearGradient>
  <linearGradient id="spindleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6e695e"/><stop offset=".45" stop-color="#cfc9b8"/><stop offset="1" stop-color="#5f5a50"/>
  </linearGradient>
  <linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffeb8f"/><stop offset=".45" stop-color="#ffd83e"/><stop offset="1" stop-color="#e5ae1c"/>
  </linearGradient>
  <radialGradient id="bsheen" cx=".3" cy=".24" r=".6">
    <stop offset="0" stop-color="#fffef0" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bshade" cx=".72" cy=".88" r=".85">
    <stop offset="0" stop-color="#8a6400" stop-opacity=".30"/><stop offset="1" stop-color="#8a6400" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bglint">
    <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dred" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#ff8a82"/><stop offset="1" stop-color="#c81e28"/>
  </radialGradient>
  <radialGradient id="dblue" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#7fabee"/><stop offset="1" stop-color="#22518f"/>
  </radialGradient>
  <radialGradient id="dgreen" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#6fd486"/><stop offset="1" stop-color="#1d7a31"/>
  </radialGradient>
  <radialGradient id="dblack" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#707070"/><stop offset="1" stop-color="#141414"/>
  </radialGradient>
  <path id="beadPath" d="M0 50 L60 4 Q70 0 80 4 L140 50 L80 96 Q70 100 60 96 Z"/>
  <clipPath id="beadClip"><use href="#beadPath"/></clipPath>
  <g id="beadShape">
    <use href="#beadPath" fill="url(#bgrad)"/>
    <g clip-path="url(#beadClip)">
      <rect x="0" y="0" width="140" height="100" fill="url(#bsheen)"/>
      <rect x="0" y="0" width="140" height="100" fill="url(#bshade)"/>
      <path d="M7 49.4 Q70 53.8 133 49.4" stroke="#8a6400" stroke-width="2.4" fill="none" opacity=".14"/>
      <path d="M15 44 L61 6.6" stroke="#fffbe0" stroke-width="2" opacity=".45" fill="none"/>
      <ellipse cx="44" cy="24" rx="17" ry="7" fill="url(#bglint)" transform="rotate(-30 44 24)"/>
    </g>
    <use href="#beadPath" fill="none" stroke="#a67c00" stroke-opacity=".55" stroke-width="2"/>
  </g>
</defs>`;

const cx = i => PADX + i*CELL + CELL/2;

/* ── 盤面の構築(桁数を変えたときに作り直す) ── */
function buildBoard(){
  const W=CELL*rods+2*PADX;
  board.setAttribute('viewBox',`0 0 ${W} ${BOARDH}`);
  let s=DEFS;
  s+=`<rect x="0" y="0" width="${W}" height="${BOARDH}" rx="26" fill="url(#frameGrad)"/>`;
  // 上縁の線状ハイライト(つやのある漆黒プラスチックの反射)
  s+=`<rect x="3.5" y="3.5" width="${W-7}" height="${BOARDH-7}" rx="22" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="2.5"/>`;
  s+=`<rect x="6.5" y="6.5" width="${W-13}" height="${BOARDH-13}" rx="19" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1.5"/>`;
  // 枠の上部の盛り上げ(ふっくらとした丸みの帯+光の線)
  s+=`<rect x="${PADX}" y="${PADY}" width="${W-2*PADX}" height="${INNERH}" rx="9" fill="url(#paperGrad)"/>`;
  // 内側の縁の陰影(枠の厚み・奥行き)
  s+=`<rect x="${PADX-3}" y="${PADY-3}" width="${W-2*PADX+6}" height="${INNERH+6}" rx="12" fill="none" stroke="#000" stroke-opacity=".40" stroke-width="6"/>`;
  for(let i=0;i<rods;i++)
    s+=`<rect x="${cx(i)-2.5}" y="${PADY+6}" width="5" height="${INNERH-12}" rx="2.5" fill="url(#spindleGrad)" stroke="#4a463e" stroke-width=".8"/>`;
  s+=`<rect x="6" y="${beamTop}" width="${W-12}" height="${BEAMH}" rx="4" fill="url(#beamGrad)"/>`;
  // 梁の上下の黒い影(梁を立たせる)
  s+=`<rect x="6" y="${beamTop-9}" width="${W-12}" height="9" fill="url(#shUp)"/>`;
  s+=`<rect x="6" y="${beamTop+BEAMH}" width="${W-12}" height="9" fill="url(#shDn)"/>`;
  // クリック領域(珠より下のレイヤー)
  for(let i=0;i<rods;i++){
    s+=`<rect class="hit" data-i="${i}" data-zone="heaven" x="${i*CELL+PADX}" y="${PADY}" width="${CELL}" height="${HEAVEN}"/>`;
    s+=`<rect class="hit" data-i="${i}" data-zone="beam"   x="${i*CELL+PADX}" y="${beamTop}" width="${CELL}" height="${BEAMH}"/>`;
    s+=`<rect class="hit" data-i="${i}" data-zone="earth"  x="${i*CELL+PADX}" y="${beamBot}" width="${CELL}" height="${ZONE}"/>`;
  }
  s+=`<g id="dotLayer"></g>`;
  s+=`<g id="beadLayer">`;
  for(let i=0;i<rods;i++){
    s+=`<g class="beadG" data-i="${i}" data-kind="hv"><use class="beadUse" href="#beadShape"/></g>`;
    for(let j=0;j<4;j++)
      s+=`<g class="beadG" data-i="${i}" data-kind="e" data-j="${j}"><use class="beadUse" href="#beadShape"/></g>`;
  }
  s+=`</g>`;
  board.innerHTML=s;
  renderDots();
  render();
}

/* ── 定位点 ── */
function gridAnchor(){ return (rods===5)? 2 : 0; }   // 5桁は右から3桁目基準・他は一の位基準
function renderDots(){
  const layer=board.querySelector('#dotLayer');
  let s='';
  for(let exp=gridAnchor();exp<rods;exp+=3){ // 定位点は3桁ごとの決まった位置にだけ打つ
    const i=rods-1-exp, c=dots.get(exp);
    const fill=c?`url(#d${c})`:'url(#dblack)', r=c?9:5.5;
    s+=`<circle cx="${cx(i)}" cy="${beamTop+BEAMH/2}" r="${r}" fill="${fill}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>`;
  }
  layer.innerHTML=s;
}
// 標準配置:梁をクリックした位にそのまま赤が付く。緑は3桁下・青は3桁上。
// 黒の点は3桁ごとの決まった位置に自動で入る
function setStandardAt(exp){
  dots.clear();
  if(exp-3>=0)   dots.set(exp-3,'green');
  dots.set(exp,'red');
  if(exp+3<rods) dots.set(exp+3,'blue');
  renderDots();
}

/* ── 珠の位置(天珠は0.67珠分、地珠は0.57珠分しっかり動く) ── */
function render(){
  const layer=board.querySelector('#beadLayer');
  if(!layer) return;
  const hvDown=PADY+4, hvUp=PADY+HEAVEN-BEADH-4;
  const eUp0=beamBot+8, eDn0=PADY+INNERH-15-4*BEADH; // j=0の位置。jごとに+100
  const kids=layer.children;
  for(let i=0;i<rods;i++){
    const d=digits[i], h=d>=5, e=d%5, x=cx(i)-BEADW/2;
    kids[i*5].style.transform=`translate(${x}px,${h?hvUp:hvDown}px)`;
    for(let j=0;j<4;j++){
      const y=(j<e)? eUp0+100*j : eDn0+100*j;
      kids[i*5+1+j].style.transform=`translate(${x}px,${y}px)`;
    }
  }
}

/* ── 操作 ── */
function setFive(i){
  const was=digits[i];
  digits[i]=was>=5? was-5 : was+5;
  (was>=5? snd.down : snd.up)();
  render();
}
function flipSlot(i,s){   // 触った位置の珠が梁に着く/離れる
  const d=digits[i], h=d>=5, e=d%5;
  const ne=(s<e)? s : s+1;
  digits[i]=h*5+ne;
  (ne>e? snd.up : snd.down)();
  render();
}
function resetAll(){ digits.fill(0); pachi(); render(); }

/* ── クリック(委譲) ── */
board.addEventListener('click',e=>{
  const g=e.target.closest('.beadG');
  if(g){
    const i=+g.dataset.i;
    if(g.dataset.kind==='hv') setFive(i);
    else flipSlot(i,+g.dataset.j);
    return;
  }
  const r=e.target.closest('.hit');
  if(!r) return;
  const i=+r.dataset.i, z=r.dataset.zone;
  if(z==='beam'){ setStandardAt(rods-1-i); return; }
  if(z==='heaven'){ setFive(i); return; }
  const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(board.getScreenCTM().inverse());
  const slot=Math.max(0,Math.min(3,Math.floor((pt.y-beamBot-8)/100)));
  flipSlot(i,slot);
});

/* ── ツールバー ── */
document.getElementById('clrDots').addEventListener('click',()=>{ dots.clear(); renderDots(); });
document.getElementById('resetBtn').addEventListener('click',resetAll);
document.getElementById('sndBtn').addEventListener('click',e=>{
  soundOn=!soundOn;
  e.currentTarget.textContent=soundOn?'🔊':'🔇';
  e.currentTarget.setAttribute('aria-pressed',String(soundOn));
  if(soundOn) snd.up();
});
document.getElementById('rodsSel').addEventListener('change',e=>{
  rods=+e.target.value;
  digits=digits.join('').slice(-rods).padStart(rods,'0').split('').map(Number);
  defaultDots();   // 切り替え後の桁数の初期配置を適用
  buildBoard();
});

buildBoard();
function defaultDots(){
  dots.clear();
  if(rods===23){ dots.set(6,'green'); dots.set(9,'red'); dots.set(12,'blue'); }
  else if(rods===17){ dots.set(3,'green'); dots.set(6,'red'); dots.set(9,'blue'); }  // 赤は右から7桁目
  else{
    const c=(rods-1)/2;
    if(c-3>=0)   dots.set(c-3,'green');
    dots.set(c,'red');
    if(c+3<rods) dots.set(c+3,'blue');
  }
  renderDots();
}
defaultDots();
</script>
</body>
</html>
